[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nace-esa-assistant"
version = "0.1.0"
description = "NACE/ESA classification assistant for Raiffeisenbank CZ Finance/MIS: ESA/NACE suggester for foreign issuers, with CTS codebook IDs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - Raiffeisenbank a.s. internal use" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  # The identifier and codebook tests feed numpy scalars (np.int64, np.float64 NaN) to the
  # normalisers. Test-only: numpy is not a runtime dependency.
  "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "api*", "ui*", "config*"]
exclude = ["tests*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["core", "api", "ui", "config"]
